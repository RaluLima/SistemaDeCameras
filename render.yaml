services:
  - type: web
    name: camera-monitor
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    healthCheckPath: /
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: camera-monitor-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://sistemadecameras.onrender.com
      - key: NEXT_PUBLIC_AI_SERVICE_URL
        value: https://camera-monitor-ai.onrender.com

  - type: web
    name: camera-monitor-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    sourceDir: ai-service
    envVars:
      - key: NEXTJS_URL
        value: https://sistemadecameras.onrender.com

databases:
  - name: camera-monitor-db
    databaseName: camera_monitor
    plan: free
